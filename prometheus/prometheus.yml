global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: honcho
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9477]
        labels:
          host: AIMachine002

  - job_name: honcho_deriver
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9091]
        labels:
          host: AIMachine002

  - job_name: hermes_lcm
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9476]
        labels:
          host: AIMachine002

  - job_name: vllm
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/active/vllm-*.yml
        refresh_interval: 30s

  - job_name: node
    static_configs:
      - targets: [127.0.0.1:9100]
        labels:
          host: AIMachine002

  - job_name: dcgm
    static_configs:
      - targets: [127.0.0.1:9400]
        labels:
          host: AIMachine002
