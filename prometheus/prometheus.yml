global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: honcho
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9477]
        labels:
          host: AIMachine002

  - job_name: honcho_deriver
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9091]
        labels:
          host: AIMachine002

  # Native Hermes plugin exporter. Prometheus uses host networking, so this
  # loopback target resolves on the same host as the plugin process.
  - job_name: hermes_honcho_tools
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9469]
        labels:
          host: AIMachine002

  # Raw MCP endpoint-call worker. This is intentionally distinct from native
  # Hermes tool instrumentation and is expected to expose honcho_mcp_* metrics.
  - job_name: honcho_mcp
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:8787]
        labels:
          host: AIMachine002

  - job_name: hermes_lcm
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9476]
        labels:
          host: AIMachine002

  # Proposed shared collector for bounded aggregate Hermes tool telemetry.
  # Prometheus uses host networking, so this loopback target is the host listener.
  - job_name: hermes_tools
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9470]
        labels:
          host: AIMachine002

  - job_name: vllm
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/active/vllm-*.yml
        refresh_interval: 30s

  - job_name: node
    static_configs:
      - targets: [127.0.0.1:9100]
        labels:
          host: AIMachine002

  - job_name: dcgm
    static_configs:
      - targets: [127.0.0.1:9400]
        labels:
          host: AIMachine002
