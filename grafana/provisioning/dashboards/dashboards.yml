apiVersion: 1

providers:
  - name: inference
    orgId: 1
    folder: Inference
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/inference

  - name: hermes-lcm
    orgId: 1
    folder: Hermes LCM
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/lcm
