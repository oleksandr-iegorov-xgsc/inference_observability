services:
  hermes-lcm-exporter:
    build:
      context: ../hermes-lcm-prometheus-exporter
    image: ${HERMES_LCM_EXPORTER_IMAGE:-hermes-lcm-prometheus-exporter:local}
    container_name: hermes-lcm-exporter
    network_mode: host
    userns_mode: keep-id
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    command:
      - --config
      - /etc/hermes-lcm-exporter/sources.json
      - --listen
      - 127.0.0.1
      - --port
      - "9476"
    volumes:
      - ./hermes-lcm-exporter/sources.json:/etc/hermes-lcm-exporter/sources.json:ro,Z
      - ${HERMES_HOME}/profiles:/lcm/profiles:ro,Z
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9476/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: inference-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./prometheus/targets:/etc/prometheus/targets:ro,Z
      - ./prometheus/rules:/etc/prometheus/rules:ro,Z
      - ./runtime/prometheus:/prometheus:Z
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: inference-grafana
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - ./runtime/grafana:/var/lib/grafana:Z
    restart: unless-stopped
    depends_on:
      - prometheus

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: inference-node-exporter
    command:
      - --path.rootfs=/host
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
